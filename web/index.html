<!doctype html>
<!-- Calgary School & Community Explorer: static entry page.
     Layout only; data loading and rendering are in app.js, strings in i18n.js. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calgary School & Community Explorer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css?v=20261005m">
</head>
<body class="rank-first">
  <header>
    <div class="titles"><h1 data-i18n="title"></h1><div class="sub" data-i18n="subtitle"></div></div>
    <div class="controls">
      <label><span data-i18n="metric"></span>
        <select id="metric">
          <option value="school_score" data-i18n="m_school_score"></option>
          <option value="elem_score" data-i18n="m_elem_score"></option>
          <option value="junior_score" data-i18n="m_junior_score"></option>
          <option value="senior_score" data-i18n="m_senior_score"></option>
          <option value="review_score" data-i18n="m_review_score"></option>
          <option value="home_value" data-i18n="m_home_value"></option>
          <option value="home_value_change_pct" data-i18n="m_home_value_change_pct"></option>
          <option value="children_pct" data-i18n="m_children_pct"></option>
          <option value="families_with_children_pct" data-i18n="m_families_with_children_pct"></option>
          <option value="value_score" data-i18n="m_value_score"></option>
        </select>
      </label>
      <label><span data-i18n="unit"></span>
        <select id="unit">
          <option value="zone" data-i18n="unit_zone"></option>
          <option value="community" data-i18n="unit_community"></option>
        </select>
      </label>
      <label id="bandWrap"><span data-i18n="band"></span>
        <select id="band">
          <option value="elem" data-i18n="band_elem"></option>
          <option value="junior" data-i18n="band_junior"></option>
          <option value="senior" data-i18n="band_senior"></option>
        </select>
      </label>
      <label class="chk"><input type="checkbox" id="showSchools" checked> <span data-i18n="show_schools"></span></label>
      <label class="chk" id="walkWrap"><input type="checkbox" id="showWalk" checked> <span data-i18n="show_walk"></span></label>
      <button id="lang"></button>
    </div>
  </header>
  <div id="disclaimer">⚠️ <span data-i18n="disclaimer"></span>
    <a href="https://www.cbe.ab.ca/find-a-school" target="_blank" data-i18n="cbe_finder"></a> ·
    <a href="https://www.cssd.ab.ca/schools" target="_blank" data-i18n="cssd_finder"></a>
  </div>
  <main>
    <section id="listPane">
      <div id="dirFilters">
        <label class="dir-program"><span data-i18n="filter_board"></span>
          <select id="boardFilter"></select>
        </label>
        <label class="dir-program"><span data-i18n="filter_grade_layer"></span>
          <select id="gradeFilter"></select>
        </label>
        <p id="configNote" class="small" data-i18n="config_note"></p>
        <label class="dir-program"><span data-i18n="filter_program"></span>
          <select id="programFilter"></select>
        </label>
        <div id="letterFilters"></div>
      </div>
      <p id="rankNote" class="small"></p>
      <input id="search" type="search">
      <table id="rankTable"><thead><tr>
        <th data-i18n="col_rank"></th>
        <th data-i18n="col_school_name"></th>
        <th data-i18n="col_board"></th>
        <th data-i18n="col_grades"></th>
        <th class="score-col">
          <span data-i18n="col_score"></span>
          <button type="button" id="scoreSource" class="source-mark" aria-expanded="false" aria-controls="scoreSourcePop">!</button>
        </th>
        <th data-i18n="col_year"></th>
      </tr></thead><tbody></tbody></table>
      <table id="commTable"><thead><tr>
        <th data-key="name" data-i18n="col_name"></th>
        <th data-key="school_score" data-i18n="col_school"></th>
        <th data-key="home_value" data-i18n="col_value"></th>
        <th data-key="value_score" data-i18n="col_vfm"></th>
      </tr></thead><tbody></tbody></table>
    </section>
    <section id="map"></section>
    <section id="panel"><p class="hint" data-i18n="click_hint"></p></section>
  </main>
  <div id="scoreSourcePop" hidden>
    <p data-i18n="score_source_body"></p>
    <a href="https://www.alberta.ca/provincial-achievement-tests#jumplinks-3" target="_blank" rel="noopener" data-i18n="score_source_link"></a>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="i18n.js?v=20261005m"></script>
  <script src="app.js?v=20261005o"></script>
</body>
</html>
