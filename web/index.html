<!doctype html>
<!-- Calgary school ranking (by PAT): static entry page.
     Layout only. app.js loads the data and connects rank.js, zone.js, and map.js.
     Strings live in i18n.js. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calgary School Ranking (by PAT)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script>
    // Change this when style.css, the page scripts, or web/data change.
    globalThis.ASSET_VERSION = "20261024p";
    document.write('<link rel="stylesheet" href="style.css?v=' + encodeURIComponent(ASSET_VERSION) + '">');
  </script>
</head>
<body>
  <header>
    <div class="titles"><h1><span data-i18n="title"></span><span class="prototype" data-i18n="prototype"></span></h1><p class="slogan" data-i18n="slogan"></p></div>
    <div class="controls">
      <select id="lang" aria-label="Language">
        <option value="en" selected>English</option>
        <option value="zh">简体中文</option>
        <option value="zh-Hant">繁體中文</option>
        <option value="fr">Français</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
      </select>
    </div>
  </header>
  <main>
    <section id="listPane">
      <div id="rankChrome">
      <h2 id="filterRegionTitle" data-i18n="filter_region"></h2>
      <div id="dirFilters">
        <div class="filter-row">
          <label class="dir-program"><span data-i18n="filter_board"></span>
            <select id="boardFilter"></select>
          </label>
          <label class="dir-program"><span data-i18n="filter_grade_layer"></span>
            <select id="gradeFilter"></select>
          </label>
        </div>
        <label class="dir-program"><span data-i18n="filter_program"></span>
          <select id="programFilter"></select>
        </label>
      </div>
      <div id="listNotes">
        <div id="listNotesBody">
          <p id="configNote" class="small" data-i18n="config_note"></p>
          <p id="rankNote" class="small"></p>
        </div>
        <button type="button" id="notesMore" class="notes-more" hidden></button>
      </div>
      <input id="search" type="search">
      </div>
      <div id="rankScroll">
      <table id="rankTable"><thead><tr>
        <th data-i18n="col_rank"></th>
        <th data-i18n="col_school_name"></th>
        <th data-i18n="col_board"></th>
        <th data-i18n="col_grades"></th>
        <th class="score-col">
          <span data-i18n="col_score"></span>
          <button type="button" id="scoreSource" class="source-mark" aria-expanded="false" aria-controls="scoreSourcePop">!</button>
        </th>
        <th data-i18n="col_year"></th>
        <th class="more-col"><span class="visually-hidden" data-i18n="more_zone"></span></th>
      </tr></thead><tbody></tbody></table>
      </div>
      <aside id="zonePanel" aria-hidden="true">
        <div class="zone-panel-bar">
          <h2 id="zonePanelTitle"></h2>
          <button type="button" id="zonePanelClose" data-i18n="zone_close"></button>
        </div>
        <div id="zonePanelBody"></div>
      </aside>
    </section>
    <section id="map"></section>
  </main>
  <div id="scoreSourcePop" hidden>
    <p data-i18n="score_source_body"></p>
    <p data-i18n="score_source_acc"></p>
    <p data-i18n="score_source_exc"></p>
    <a href="https://www.alberta.ca/provincial-achievement-tests#jumplinks-3" target="_blank" rel="noopener" data-i18n="score_source_link"></a>
  </div>
  <div id="termPop" hidden></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    document.write('<script src="i18n.js?v=' + encodeURIComponent(ASSET_VERSION) + '"><\/script>');
    document.write('<script type="module" src="app.js?v=' + encodeURIComponent(ASSET_VERSION) + '"><\/script>');
  </script>
</body>
</html>
