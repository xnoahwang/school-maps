<!doctype html>
<!-- Calgary school ranking: static entry page.
     Layout only. app.js loads the data and connects rank.js, zone.js, and map.js.
     Strings live in i18n.js. A phone in portrait shows the rotate prompt until
     the browser is landscape. app.js keeps that frame if the phone turns back. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Calgary School Ranking</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script>
    // Change this when style.css, the page scripts, or web/data change.
    globalThis.ASSET_VERSION = "20261029ai";
    document.write('<link rel="stylesheet" href="style.css?v=' + encodeURIComponent(ASSET_VERSION) + '">');
  </script>
  <script>
    // A phone in portrait is blocked until it is landscape. Set the class
    // here so the first paint does not wait for app.js.
    (function () {
      var phone = window.matchMedia("(pointer: coarse)").matches;
      var land = phone && window.matchMedia("(orientation: landscape) and (max-height: 520px)").matches;
      var port = phone && window.matchMedia("(orientation: portrait) and (max-width: 900px)").matches;
      if (land) document.documentElement.classList.add("phone-land");
      if (port) document.documentElement.classList.add("need-rotate");
    })();
  </script>
</head>
<body>
  <div id="rotateGate" role="dialog" aria-modal="true" aria-labelledby="rotateGateText">
    <!-- Tabler Icons (MIT): device-mobile, arrow-right, device-mobile-rotated. -->
    <svg class="rotate-phone" viewBox="0 0 88 24" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 5a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2z" />
        <path d="M11 4h2" />
        <path d="M12 17v.01" />
        <path d="M33 12h14" />
        <path d="M41 18l6 -6" />
        <path d="M41 6l6 6" />
        <g transform="translate(152) scale(-1 1)">
          <path d="M67 6m0 2a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v8a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2z" />
          <path d="M84 11v2" />
          <path d="M71 12h-.01" />
        </g>
      </g>
    </svg>
    <p id="rotateGateText" data-i18n="rotate_gate">Turn your phone sideways to use this page.</p>
  </div>
  <header>
    <div class="titles"><h1><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 10 12 5l10 5-10 5L2 10z"/><path d="M6 12.2V16c0 1.4 2.7 2.6 6 2.6s6-1.2 6-2.6v-3.8"/><path d="M22 10v6"/></svg></span><span data-i18n="title"></span><span class="prototype" data-i18n="prototype"></span></h1></div>
    <p class="slogan" data-i18n="slogan"></p>
    <div class="controls">
      <select id="lang" aria-label="Language">
        <option value="en" selected>English</option>
        <option value="zh">简体中文</option>
        <option value="zh-Hant">繁體中文</option>
        <option value="fr">Français</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
      </select>
    </div>
  </header>
  <main>
    <section id="listPane">
      <div id="rankChrome">
      <h2 id="filterRegionTitle" class="visually-hidden" data-i18n="filter_region"></h2>
      <div id="dirFilters">
        <div id="levelSwitch" role="group">
          <button type="button" id="levelElem" data-level="elem" aria-pressed="true"><span data-i18n="level_elem"></span> <span class="level-by"><span data-i18n="level_by_pat_before"></span><span class="level-exam" data-exam="pat" data-i18n="level_exam_pat"></span><span data-i18n="level_by_pat_after"></span></span></button>
          <button type="button" id="levelJunior" data-level="junior" aria-pressed="false"><span data-i18n="level_junior"></span> <span class="level-by"><span data-i18n="level_by_pat_before"></span><span class="level-exam" data-exam="pat" data-i18n="level_exam_pat"></span><span data-i18n="level_by_pat_after"></span></span></button>
          <button type="button" id="levelHigh" data-level="high" aria-pressed="false"><span data-i18n="level_high"></span> <span class="level-by"><span data-i18n="level_by_diploma_before"></span><span class="level-exam" data-exam="diploma" data-i18n="level_exam_diploma"></span><span data-i18n="level_by_diploma_after"></span></span></button>
        </div>
        <div class="filter-row">
          <label class="dir-program"><span data-i18n="filter_board"></span>
            <select id="boardFilter"></select>
          </label>
          <label class="dir-program" id="gradeFilterWrap"><span data-i18n="filter_grade_layer"></span>
            <select id="gradeFilter"></select>
          </label>
          <label class="dir-program"><span data-i18n="filter_program"></span>
            <select id="programFilter"></select>
          </label>
        </div>
      </div>
      <div id="listNotes">
        <div id="listNotesBody">
          <p id="configNote" class="small" data-i18n="config_note"></p>
          <p id="rankNote" class="small"></p>
        </div>
        <button type="button" id="notesMore" class="notes-more" hidden></button>
      </div>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="search" type="search">
      </div>
      </div>
      <div id="rankScroll">
      <table id="rankTable"><thead><tr>
        <th data-i18n="col_rank"></th>
        <th data-i18n="col_school_name"></th>
        <th class="sort-col" data-sort="score" aria-sort="descending"><button type="button" data-i18n="col_score"></button></th>
        <th class="sort-col" data-sort="acc" aria-sort="none"><button type="button" data-i18n="col_acc" data-i18n-title="pat_acc"></button></th>
        <th class="sort-col" data-sort="exc" aria-sort="none"><button type="button" data-i18n="col_exc" data-i18n-title="pat_exc"></button></th>
        <th class="more-col"><span class="visually-hidden" data-i18n="more_zone"></span></th>
      </tr></thead><tbody></tbody></table>
      </div>
      <div id="scoreLegend">
        <p class="legend-acc" data-explain="score_source_acc" tabindex="0"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg><span><b data-i18n="pat_acc"></b> <span data-i18n="legend_acc"></span></span></p>
        <p class="legend-exc" data-explain="score_source_exc" tabindex="0"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.7 5.6 6.2.9-4.5 4.3 1.1 6.1L12 16.6 6.5 19.5l1.1-6.1L3.1 9.1l6.2-.9z"/></svg><span><b data-i18n="pat_exc"></b> <span data-i18n="legend_exc"></span></span></p>
      </div>
      <aside id="zonePanel" aria-hidden="true">
        <div class="zone-panel-bar">
          <h2 id="zonePanelTitle"></h2>
          <button type="button" id="zonePanelClose" data-i18n="zone_close"></button>
        </div>
        <div id="zonePanelBody"></div>
      </aside>
    </section>
    <section id="map"></section>
  </main>
  <div id="scoreSourcePop" hidden>
    <p data-i18n="score_source_body"></p>
    <p data-i18n="score_source_acc"></p>
    <p data-i18n="score_source_exc"></p>
    <a id="scoreSourceLink" href="https://www.alberta.ca/provincial-achievement-tests#jumplinks-3" target="_blank" rel="noopener" data-i18n="score_source_link"></a>
  </div>
  <div id="termPop" hidden></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    document.write('<script src="i18n.js?v=' + encodeURIComponent(ASSET_VERSION) + '"><\/script>');
    document.write('<script type="module" src="app.js?v=' + encodeURIComponent(ASSET_VERSION) + '"><\/script>');
  </script>
</body>
</html>
